# PR と main への push で lint / test / build / e2e を自動実行する(Issue #92, #148)。
# 受け入れ条件(CLAUDE.md)の「pnpm lint / build / test が通る」を機械的に担保する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読み取り専用の検証ジョブのため、GITHUB_TOKEN の権限を最小化する
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 読み取り専用のワークフローのため認証情報を残さない
          persist-credentials: false

      # pnpm のバージョンは package.json の packageManager フィールドから解決する
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E スモーク(#95)は lint/test/build と独立したジョブにして失敗を切り分ける(Issue #148)。
  # 4テスト・実行時間 20秒未満と軽量なため、毎 PR / main push で実行する。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
